name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Capacitor & Android Platform
        run: |
          mkdir -p www
          cp index.html www/index.html || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Replace Default Capacitor Icon with Custom Matiks o/o Logo
        run: |
          # Remove ALL default Capacitor adaptive XML & WebP icons so Android never shows the blue Capacitor X logo
          rm -rf android/app/src/main/res/mipmap-anydpi*
          find android/app/src/main/res/ -name "ic_launcher*.webp" -delete || true
          find android/app/src/main/res/ -name "ic_launcher*.xml" -delete || true
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp matiks-icon.png "$dir/ic_launcher.png"
              cp matiks-icon.png "$dir/ic_launcher_round.png"
              cp matiks-foreground.png "$dir/ic_launcher_foreground.png"
              cp matiks-background.png "$dir/ic_launcher_background.png"
            fi
          done

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Matiks-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
